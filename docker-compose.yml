services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "app.hmac_key=${HMAC_KEY}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HMAC_KEY: ${HMAC_KEY}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      HMAC_KEY: ${HMAC_KEY}
      AES_KEY: ${AES_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FOG_API_KEY: ${FOG_API_KEY}
      RETENTION_HOURS: ${RETENTION_HOURS}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  fog-sim:
    build:
      context: .
      dockerfile: fog-node/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL}
      HMAC_KEY: ${HMAC_KEY}
      AES_KEY: ${AES_KEY}
      FOG_API_KEY: ${FOG_API_KEY}
      API_BASE_URL: http://api:8000
      PYTHONPATH: /app
      FOG_MODE: A
    depends_on:
      api:
        condition: service_started
    command: ["python", "fog-node/fog_sim.py"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  pgdata:
