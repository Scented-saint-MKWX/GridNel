# Emergency backend build, 2026-09-13 — see DECISIONS.md #7a. Reconstructed
# from TEAM.md §7/§8 (P5 spec: api/db/redis/frontend, healthchecks,
# depends_on: condition: service_healthy) since the real file was never
# committed (0 bytes).
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    command: ["python", "db/seed.py"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  flusher:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    command: ["python", "api/flusher.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  sweeper:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    command: ["python", "db/sweeper.py"]
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
